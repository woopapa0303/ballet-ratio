name: 경쟁률 자동 갱신

# GitHub의 schedule(cron)은 무료 저장소에서 자주 지연·생략된다.
# 그래서 한 번 실행되면 약 5시간 동안 스스로 반복 확인하는 구조로 두고,
# cron 은 그 루프를 주기적으로 되살리는 용도로만 쓴다.
#
# 대학 원본이 매시 정각에 갱신되므로, 정각 직후에는 20초 간격으로 확인한다.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scrape.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: ratio-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 반복 수집 (정각 직후 20초 간격)
        run: |
          git config user.name "ratio-bot"
          git config user.email "actions@github.com"

          # 2026-09-12 00:00 KST = 2026-09-11 15:00 UTC
          ADMISSION_END=$(date -u -d "2026-09-11 15:00:00" +%s)
          LOOP_END=$(( $(date -u +%s) + 5 * 3600 ))

          while true; do
            NOW=$(date -u +%s)
            if [ "$NOW" -gt "$ADMISSION_END" ]; then
              echo "접수 기간이 종료되어 반복을 마칩니다."
              break
            fi
            if [ "$NOW" -gt "$LOOP_END" ]; then
              echo "이번 실행의 수명이 끝났습니다. 다음 실행이 이어받습니다."
              break
            fi

            python3 scrape.py || echo "수집 실패 — 다음 회차에 재시도합니다."

            if ! git diff --quiet -- index.html data.json; then
              git add index.html data.json
              git commit -q -m "경쟁률 갱신 $(TZ=Asia/Seoul date '+%m.%d %H:%M')"
              git pull -q --rebase --autostash || true
              git push -q || echo "푸시 실패 — 다음 회차에 재시도합니다."
              echo "갱신 반영 $(TZ=Asia/Seoul date '+%H:%M:%S')"
            fi

            # 정각 직후는 촘촘하게, 그 외에는 여유 있게 확인
            MIN=$(date -u +%-M)
            if [ "$MIN" -lt 6 ]; then
              sleep 20
            elif [ "$MIN" -lt 12 ]; then
              sleep 60
            else
              sleep 180
            fi
          done
