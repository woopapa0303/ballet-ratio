name: 진단
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 프록시 후보 시험
        run: |
          U="https://addon.jinhakapply.com/RatioV1/RatioH/Ratio10420521.html"
          E=$(printf %s "$U" | jq -sRr @uri)
          try() {
            name="$1"; url="$2"
            code=$(curl -s -L --max-time 25 -o /tmp/out -w "%{http_code}" "$url" || echo 000)
            size=$( [ -f /tmp/out ] && wc -c < /tmp/out || echo 0)
            hits=$(grep -c 발레 /tmp/out 2>/dev/null || echo 0)
            echo "RESULT $name http=$code size=$size ballet=$hits"
          }
          try codetabs   "https://api.codetabs.com/v1/proxy?quest=$E"
          try corsproxy  "https://corsproxy.io/?$E"
          try isomorphic "https://cors.isomorphic-git.org/$U"
          try jina_http  "https://r.jina.ai/http://addon.jinhakapply.com/RatioV1/RatioH/Ratio10420521.html"
          try wayback    "http://archive.org/wayback/available?url=addon.jinhakapply.com/RatioV1/RatioH/Ratio10420521.html"
